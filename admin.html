<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول الإدارة | Masr Rehab</title>
    <style>
        body { background: linear-gradient(rgba(27,67,50,0.8), rgba(27,67,50,0.8)), url('https://images.pexels.com/photos/4021775/pexels-photo-4021775.jpeg?auto=compress'); background-size: cover; height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .login-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(15px); padding: 40px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.2); text-align: center; color: white; width: 100%; max-width: 350px; }
        input { width: 100%; padding: 12px; margin: 20px 0; border-radius: 10px; border: none; outline: none; }
        button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #95d5b2; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Admin Access</h2>
        <input type="password" id="passInput" placeholder="أدخل كلمة المرور">
        <button onclick="checkLogin()">دخول</button>
    </div>
    <script>
        function checkLogin() {
            if (document.getElementById('passInput').value === "hamza") {
                sessionStorage.setItem("admin_access", "true"); // الختم السري
                window.location.href = "dashboard.html";
            } else { alert("كلمة المرور خاطئة!"); }
        }
        document.getElementById('passInput').addEventListener("keypress", (e) => { if(e.key === "Enter") checkLogin(); });
    </script>
</body>
</html>
