<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Masr Rehab</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(45, 106, 79, 0.7), rgba(45, 106, 79, 0.7)), 
                        url('https://images.unsplash.com/photo-1576091160550-2173dbc9982a?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
            color: white;
        }
        h2 { margin-bottom: 30px; font-weight: 700; letter-spacing: 1px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
            outline: none;
            font-size: 16px;
        }
        button {
            background: #d8f3dc;
            color: #1b4332;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: #b7e4c7; transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Admin Dashboard</h2>
        <input type="password" id="pass" placeholder="Enter Password">
        <button onclick="check()">Login</button>
    </div>

    <script>
        function check() {
            var p = document.getElementById('pass').value;
            // السطر اللي جاي ده هو سطر الباسورد (رقم 70 تقريباً في الملف الجديد)
            if(p === "hamza") { 
                alert("Access Granted! Opening Dashboard...");
                window.location.href = "dashboard.html"; 
            } else {
                alert("Access Denied! Incorrect Password.");
            }
        }
    </script>
</body>
</html>
