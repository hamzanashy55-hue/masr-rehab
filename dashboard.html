<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة البيانات | Masr Rehab</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        // 🛡️ العسكري: لو مفيش ختم في الذاكرة، اطرد الشخص لصفحة البوابة فوراً
        if (sessionStorage.getItem("admin_access") !== "true") {
            window.location.href = "admin.html";
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f0f4f8; padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: 20px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        h1 { color: #1b4332; margin: 0; font-size: 22px; }
        .btn-exit { background: #e63946; color: white; padding: 8px 18px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1b4332; color: white; padding: 15px; text-align: right; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 14px; }
        .branch-tag { background: #d8f3dc; color: #1b4332; padding: 4px 10px; border-radius: 8px; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📋 سجل حجوزات المرضى</h1>
        <a href="index.html" class="btn-exit" onclick="sessionStorage.clear()">تسجيل الخروج</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>المريض</th>
                <th>الهاتف</th>
                <th>الفرع</th>
                <th>التاريخ</th>
            </tr>
        </thead>
        <tbody id="data-list">
            </tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCogxrENYLFS-sWKdJGQ39WKbYKfxS3GkM",
        authDomain: "masr-rehab.firebaseapp.com",
        projectId: "masr-rehab",
        storageBucket: "masr-rehab.firebasestorage.app",
        messagingSenderId: "803513512222",
        appId: "1:803513512222:web:430fcb908eba84e92c190f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const q = query(collection(db, "appointments"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snap) => {
        let rows = "";
        snap.forEach(doc => {
            const d = doc.data();
            const date = d.createdAt ? new Date(d.createdAt.seconds * 1000).toLocaleString('ar-EG') : "...";
            rows += `<tr><td><b>${d.patientName}</b></td><td>${d.patientPhone}</td><td><span class="branch-tag">${d.branch}</span></td><td>${date}</td></tr>`;
        });
        document.getElementById('data-list').innerHTML = rows;
    });
</script>
</body>
</html>
